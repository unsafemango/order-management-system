version: '3.9'
services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppass
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  products-service:
    build: ./products-service
    environment:
      - DB_DSN=postgres://app:apppass@pg:5432/retail?sslmode=disable
      - HTTP_ADDR=:8081
    depends_on: [pg]
    ports: ["8081:8081"]

  orders-service:
    build: ./orders-service
    environment:
      - DB_DSN=postgres://app:apppass@pg:5432/retail?sslmode=disable
      - HTTP_ADDR=:8080
      - PRODUCTS_URL=http://products-service:8081/v1
    depends_on: [pg, products-service]
    ports: ["8080:8080"]

volumes:
  pgdata: